name: Deploy to Cloudflare

on:
push:
branches:
- main
- dev

jobs:
deploy-dashboard:
name: Deploy Dashboard to Pages
runs-on: ubuntu-latest
steps:
- name: Checkout code
uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '20'
      # 注意：我們已經把 cache: 'npm' 拿掉了，避免找不到 package-lock.json

  - name: Install Dependencies
    run: npm install

  - name: Build Dashboard
    run: npm run build --workspace=apps/dashboard

  # 改用更直接的 npx wrangler 指令，並開啟除錯日誌
  - name: Deploy Dashboard to Pages
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # 開啟最高級別的日誌，幫助我們抓蟲
      WRANGLER_LOG: debug
    run: |
      npx wrangler pages deploy apps/dashboard/dist --project-name smart-menu-dashboard --branch ${{ github.ref_name }}
